services:
  # Full-Stack Web Service (FastAPI + React Frontend)
  - type: web
    name: agrosense-ai
    env: python
    region: oregon
    buildCommand: cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: agrosence_ai
      - key: VITE_API_BASE_URL
        value: ""
